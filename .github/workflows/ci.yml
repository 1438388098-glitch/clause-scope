# CI：单测门禁（评测复现见 README「Reproduce the evaluation」）
# 依赖说明：requirements.txt 为纯标准库（v0.1 零第三方依赖），
# clause_scope 以 sys.path 直连仓库根目录，无需安装步骤。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 全量单测（24 例）
        run: python -m unittest discover -s tests
